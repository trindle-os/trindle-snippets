[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 reads only atspi's own interface files, in atspi's own tests" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 reads only atspi's own interface files, in atspi's own tests" },
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/trindle-os/trindle-toolkit"]
