# Snippets as a Trindle plugin, interface 1. packaging/trindle-plugin.sh builds
# the folder around this file; Version must match Cargo.toml's.

[Plugin]
Interface=1
Id=org.trindle.Snippets
Name=Snippets
Version=2.1.0
Permissions=files;expand

[Ring]
Icon=snippets-symbolic.svg
Label=Snippets
Run=bin/snippets
Menu=on;off

[Menu on]
Label=Turn typing expansion on
Run=bin/snippets --expand on

[Menu off]
Label=Turn typing expansion off
Run=bin/snippets --expand off
